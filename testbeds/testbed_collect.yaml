devices:
  ### ACCES - PEAG - CHAINE N1  ##################################
  demo-7750-collft-01:
    region: chaine_n
    alias: demo-7750-collft-01
    os: sros
    custom:
      type: 7750_SR
      arch: 7750_SR_7
      role: COLLECT_COLLFT
      process_isis: COLLECT_COLLFT
      manufacturer: Nokia
    connections:
      vty:
        protocol: ssh
        host: 203.0.113.110
        port: 22
        proxy: jump-n
