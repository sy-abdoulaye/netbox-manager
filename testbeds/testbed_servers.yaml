          - polatis-01
    os: polatis
    type: polatis
  polatis-02:
    connections:
      defaults:
        class: "pypolatis.session"
      http_session:
        host: 203.0.113.21
        protocol: https
        login_creds:
          - polatis-02
    os: polatis
    type: polatis
  polatis-03:
