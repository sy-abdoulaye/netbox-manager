  jump-n:
    connections:
      vty:
        host: 203.0.113.41
        protocol: ssh
        login_creds:
          - ssh_chaine_n
    os: linux
    type: linux
  # OLT chain N chain N1
  jump-olt:
    connections:
      vty:
        host: 203.0.113.42
        protocol: ssh
