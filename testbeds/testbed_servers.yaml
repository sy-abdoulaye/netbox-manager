  vipt:
    connections:
      vty:
        host: 203.0.113.10
        protocol: ssh
        login_creds:
          - vipt
    os: linux
    type: linux
  #################################################
  velocity:
    connections:
      http_session:
        host: 203.0.113.11
        protocol: https
        login_creds:
          - velocity
    os: velocity
    type: velocity
  #################################################
  polatis-01:
    connections:
      defaults:
        class: "pypolatis.session"
      http_session:
        host: 203.0.113.20
