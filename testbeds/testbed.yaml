extends: base_testbed.yaml
# Add device in this section below devices
# NOTE: fichier remplacé par un échantillon synthétique (4 devices fictifs)
# pour la publication — l'original contient le véritable inventaire coeur réseau.
devices:
  # COREBIB - RR/RRVPN - CHAINE N1 ##################################
  demo-7750-rrbib-01:
    region: chaine_n1
    alias: demo-7750-rrbib-01
    os: sros
    custom:
      type: 7750_SR
      arch: 7750_SR_1_md
      role: COREIP_RRVPN
      process_isis: COEUR
      manufacturer: Nokia
    connections:
      vty:
        protocol: ssh
        host: 203.0.113.120
        port: 22
        proxy: jump-n1
        class: "unicon.Unicon"
        debug: True
        settings:
          GRACEFUL_DISCONNECT_WAIT_SEC: 0
          POST_DISCONNECT_WAIT_SEC: 0

