# ============================================================
#  Constants configuration (YAML)
#  File: common/config/constants.yaml
#
#  This file centralizes all business and technical constants
#  used to normalize, enrich and correlate network data coming
#  from CLI outputs, RackTables and NetBox.
#
#  Purpose:
#   - Normalize device roles and platforms
#   - Identify network operating systems
#   - Normalize interface names and types
#   - Provide hardware physical characteristics
# ============================================================

# ------------------------------------------------------------
# Logical zones used to qualify environments
# (lab, production, redundancy, etc.)
# ------------------------------------------------------------
zones:
  N: Lab Chaine N
  Nplus1: Lab Chaine N1

# ------------------------------------------------------------
# NetBox role normalization
#
# Some roles detected via naming patterns do not exactly match
# NetBox roles. This mapping ensures consistency.
# ------------------------------------------------------------
expected_netbox_roles:
  pnbib: pbib
  penbib: pebib
  peintnbib: peint
  asr9k-co: co

# ------------------------------------------------------------
# Mapping between device roles and network operating systems
#
# This allows the system to:
#   - Select the correct parser
#   - Apply vendor-specific interface naming rules
#   - Enforce OS-related constraints
# ------------------------------------------------------------
devices_os_supported_roles:
  iosxr:
    - rr
    - rrvpn
    - co
    - xtc
    - penbib
    - peintnbib
    - pnbib
    - spinebib
    - leafbib
    - pespon
    - dcigw
    - asr96-01
    - pecng
    - pesng
  iosxe:
    - ipsec
    - pe-nim
    - rr-bib
  sros:
    - pesms
    - 7750
    - segw
  hvrp:
    - peag
    - pesat
    - ftts
    - swsrthd
    - ura
    - uar
  nxos:
    - leaf
    - spine

# ------------------------------------------------------------
# Interface prefix → NetBox interface type mapping
#
# Used to properly assign interface media types in NetBox
# based on CLI interface naming conventions.
# ------------------------------------------------------------
interfaces_types:
  Hu: 100gbase-x-qsfp28
  Mg: 1000base-t
  MG: 1000base-t
  Ten: 10gbase-x-sfpp
  Gi: 1000base-x-sfp
  Fo: 40gbase-x-qsfpp
  Twe: 200gbase-x-qsfp56
  FH: 400gbase-x-qsfpdd
  Lo: virtual
  Bu: lag

